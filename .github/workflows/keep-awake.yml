name: 🔋 Server wach halten

# Pingt den Render-Server regelmäßig an, damit der kostenlose Plan
# nie in den Sleep-Modus gerät (Render schläft nach ~15 Min. ohne Anfragen).

on:
  schedule:
    - cron: '*/7 * * * *'   # alle 7 Minuten (UTC)
  workflow_dispatch:         # manuell testbar über "Run workflow"

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: URL ermitteln
        id: url
        env:
          VAR_URL: ${{ vars.KEEP_AWAKE_URL }}
        run: |
          URL="$VAR_URL"
          if [ -z "$URL" ] && [ -f keep-awake-url.txt ]; then
            URL=$(grep -v '^[[:space:]]*#' keep-awake-url.txt | tr -d '[:space:]' | head -n 1)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::notice::Keine URL hinterlegt – Repo-Variable KEEP_AWAKE_URL setzen ODER deine Adresse in keep-awake-url.txt eintragen."
          else
            echo "Pinge an: $URL"
          fi

      - name: Render-Strecke aufwecken
        if: steps.url.outputs.url != ''
        env:
          TARGET: ${{ steps.url.outputs.url }}
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$TARGET/" 2>/dev/null || true)
            code=${code:-000}
            echo "Versuch $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ Server ist wach und antwortet."
              exit 0
            fi
            sleep 15
          done
          echo "❌ Server antwortet nicht mit HTTP 200 – Service evtl. noch nicht deployed, im Sleep oder gelöscht."
          exit 1
