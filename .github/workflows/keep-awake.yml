name: 🔋 Server wach halten

# Pingt den Render-Server regelmäßig an, damit der kostenlose Plan
# nie in den Sleep-Modus gerät (Render schläft nach ~15 Min. ohne Anfragen).

on:
  schedule:
    - cron: '*/5 * * * *'   # alle 5 Minuten (UTC) – Puffer gegen GitHub-Verzögerungen
    - cron: '17 6 * * 1'     # wöchentlich (Mo 06:17 UTC) für den Aktivitäts-Commit
  workflow_dispatch:         # manuell testbar über "Run workflow"

permissions:
  contents: write

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: URL ermitteln
        id: url
        env:
          VAR_URL: ${{ vars.KEEP_AWAKE_URL }}
        run: |
          URL="$VAR_URL"
          if [ -z "$URL" ] && [ -f keep-awake-url.txt ]; then
            URL=$(grep -v '^[[:space:]]*#' keep-awake-url.txt | tr -d '[:space:]' | head -n 1)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::notice::Keine URL hinterlegt – Repo-Variable KEEP_AWAKE_URL setzen ODER deine Adresse in keep-awake-url.txt eintragen."
          else
            echo "Pinge an: $URL"
          fi

      - name: Render-Strecke aufwecken
        if: steps.url.outputs.url != ''
        env:
          TARGET: ${{ steps.url.outputs.url }}
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$TARGET/" 2>/dev/null || true)
            code=${code:-000}
            echo "Versuch $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ Server ist wach und antwortet."
              exit 0
            fi
            sleep 15
          done
          echo "❌ Server antwortet nicht mit HTTP 200 – Service evtl. noch nicht deployed, im Sleep oder gelöscht."
          exit 1

      - name: Wöchentlicher Aktivitäts-Commit (verhindert 60-Tage-Deaktivierung)
        if: github.event.schedule == '17 6 * * 1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u '+%Y-%m-%d %H:%M UTC – WorldVote-Server wach gehalten, Repo aktiv.' > keep-awake-status.txt
          git add keep-awake-status.txt
          git commit -m "chore: wöchentlicher Keep-Awake-Aktivitäts-Commit" || echo "nichts zu committen"
          git push
